server {
 listen 80;
 server_name cinema.local.vr360.pro;
 include ssl/dehydrated.conf;

 location / {
  return 301 https://$host$request_uri;
 }
}

server {
 listen 443 ssl;
 http2 on;
 server_name cinema.local.vr360.pro;
 ssl_certificate /etc/dehydrated/certs/cinema.local.vr360.pro/fullchain.pem;
 ssl_certificate_key /etc/dehydrated/certs/cinema.local.vr360.pro/privkey.pem;
 ssl_trusted_certificate /etc/dehydrated/certs/cinema.local.vr360.pro/chain.pem;
 include ssl/ssl.conf;
 access_log /var/log/nginx/cinema.local.vr360.pro-access.log combined;
 error_log /var/log/nginx/cinema.local.vr360.pro-error.log;

 # Keep existing QR codes and bookmarks working while removing /new from the browser URL.
 location = /new {
  return 308 /;
 }

 location ~ ^/new(?<clean_path>/.*)$ {
  return 308 $clean_path$is_args$args;
 }

 location /static/ {
  alias /opt/qr_app/srv/staticfiles/;
  expires 30d;
  add_header Cache-Control "public";
 }

 location /control/ {
  proxy_pass http://127.0.0.1:11000/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Scheme $scheme;
  proxy_buffering off;
 }

 # These three handlers belong to SvelteKit. All other /api routes stay on Django.
 location ~ ^/api/(auth|stats|payments)$ {
  proxy_pass http://127.0.0.1:8004;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Scheme $scheme;
  proxy_buffering off;
 }

 location ~ ^/(admin|api) {
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_redirect off;
 }

 location /media/ {
  alias /opt/qr_app/srv/media/;
 }

 location / {
  proxy_pass http://127.0.0.1:8004;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Scheme $scheme;
  proxy_buffering off;
 }
}
